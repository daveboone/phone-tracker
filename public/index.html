<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Phone Tracker Map</title>
    
    <!-- Official Leaflet Map Stylesheet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Official Leaflet Map Engine -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: Arial, sans-serif; }
        #map { height: 100vh; width: 100%; }
        .info-panel { position: absolute; top: 10px; left: 50px; background: white; padding: 10px 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); z-index: 1000; }
    </style>
</head>
<body>

    <div class="info-panel">
        <h3>Dave & Jan</h3>
        <p id="coords">Waiting for update...</p>
    </div>

    <div id="map"></div>

    <script>
        // Make sure Leaflet (L) exists before running
        if (typeof L !== 'undefined') {
            const map = L.map('map').setView([39.8283, -98.5795], 4);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap contributors'
            }).addTo(map);
            
            let marker = L.marker([39.8283, -98.5795]).addTo(map);

            async function fetchLatestLocation() {
                try {
                    const response = await fetch('api/current-location'); 
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    
                    const data = await response.json();
                    console.log("Webpage received data:", data);

                    const lat = data.lat !== undefined ? data.lat : data.latitude;
                    const lng = data.lng !== undefined ? data.lng : data.longitude;
                    const elev = data.altitude !== undefined ? data.altitude*3.28 : 0.0;
                    const spd  = data.speed !== undefined ? data.speed * 2.236 : 0.0;

                    if (lat !== undefined && lng !== undefined) {
                        marker.setLatLng([lat, lng]);
                        document.getElementById('coords').innerText = `Elev: ${elev.toFixed(0)}, Speed: ${spd.toFixed(0)}`;
                    } else {
                        document.getElementById('coords').innerText = "Data error: Missing fields.";
                    }
                } catch (err) {
                    console.error("Error fetching data:", err);
                    document.getElementById('coords').innerText = "Connection error.";
                }
            }

            setInterval(fetchLatestLocation, 5000);
            fetchLatestLocation();
        } else {
            document.getElementById('coords').innerText = "Error: Map library failed to load.";
        }
    </script>
</body>
</html>
